# Custom nginx.conf for non-root operation.
# - No 'user' directive: nginx runs workers as the process owner.
# - pid and all temp paths redirect to /tmp (writable by any uid).
# - Logs go to stdout/stderr for Docker log capture.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Redirect all writable temp dirs to /tmp (default paths under
    # /var/lib/nginx are not writable by a non-root uid).
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
