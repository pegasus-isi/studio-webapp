upstream studio_api {
    server 127.0.0.1:8080;
}

upstream studio_web {
    server 127.0.0.1:3000;
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888;
    server_name _;

    client_max_body_size 100M;

    # --- Security headers ---
    # Declared once here and inherited by every location: nginx drops the whole
    # inherited set the moment a location declares an add_header of its own, so
    # do NOT add one inside a location unless you repeat everything you still
    # want (the two /jupyter locations below do exactly that, on purpose).
    # `always` keeps them on 4xx/5xx too. No script-src/default-src: Next.js
    # ships inline scripts (theme bootstrap, hydration data) that would need
    # nonces to survive one. base-uri 'self' is the browser-side backstop for
    # the <base href> validation in studio-web/lib/urls.ts; frame-ancestors
    # 'self' keeps the chat iframe (same-origin, from JupyterLab) working while
    # refusing foreign framing; object-src 'none' costs nothing here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # --- Forwarded-header hygiene ---
    # Upstreams must only ever see values nginx produced, because a client can
    # send any of these itself and nothing downstream can tell the difference:
    #   X-Forwarded-Prefix  the captured /user/<name> under the prefix blocks,
    #                       removed everywhere else. Next builds <base href>
    #                       from it, so a client-supplied value would repoint
    #                       every URL in the page.
    #   X-Script-Name       removed; nothing in the stack sets it any more.
    #   X-Forwarded-Host    $http_host, i.e. the Host header WITH its port.
    #                       studio-api's origin check compares this to the
    #                       browser's Origin; $host drops the port and would
    #                       reject every WebSocket handshake on a non-443
    #                       deployment such as local-test-instance.sh on :8888.
    #   X-Auth-User         removed — identity comes from JUPYTERHUB_USER, so
    #                       the STUDIO_TRUST_AUTH_HEADER opt-in has no effect
    #                       behind this nginx (see README).
    # Setting a header to "" removes it. proxy_set_header is NOT inherited into
    # a location that declares any proxy_set_header of its own, and every
    # location here does, so the four lines are repeated per location;
    # studio-api/tests/test_nginx_hardening.py enforces that they all are.

    # KubeSpawner/JupyterHub exposes the server below /user/<name>. The browser
    # must keep that prefix, but the internal Studio services route from /.
    location ~ ^/user/[^/]+$ {
        return 308 $uri/$is_args$args;
    }

    # Capture the path and let proxy_pass substitute it. NOT `rewrite ... break`
    # with a URI-less proxy_pass: that pairing sent the upstream the *original*
    # URI truncated to the rewritten URI's length, so /user/x/api/health arrived
    # as /user/kthar — right length, wrong bytes — and every API call 404'd
    # behind KubeSpawner while working fine on a direct port.
    #
    # The capture is taken from the normalized, percent-DECODED $uri and a
    # variable proxy_pass sends that string verbatim, so /user/x/api/foo%3Fa=1
    # reaches FastAPI as /api/foo?a=1. Harmless today — the API takes file paths
    # as query parameters, forwarded raw via $args, and has no path-based
    # authorization to slip past. If a path parameter ever has to survive
    # encoded, capture from `map $request_uri` instead and drop $is_args$args.
    # Left as-is deliberately.
    location ~ ^(?<studio_prefix>/user/[^/]+)(?<studio_api_path>/api(?:/.*)?)$ {
        proxy_pass http://studio_api$studio_api_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix $studio_prefix;
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Same shape as /api above, same bug, same fix.
    location ~ ^(?<studio_prefix>/user/[^/]+)(?<studio_ws_path>/ws(?:/.*)?)$ {
        proxy_pass http://studio_api$studio_ws_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix $studio_prefix;
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # JupyterLab is prefix-aware; jupyter.sh starts it with
    # ${JUPYTERHUB_SERVICE_PREFIX}/jupyter/ when KubeSpawner provides that env.
    location ~ ^(?<studio_prefix>/user/[^/]+)/jupyter(?:/.*)?$ {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # jupyter_server's origin check compares the Origin header's host:port
        # to Host verbatim. `$host` drops the port, so once allow_origin is
        # same-origin only, every Lab POST and kernel WebSocket on a
        # localhost:8888 run would be refused as cross-origin. Identical to
        # `$host` for a portless Host, so production is unaffected.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix $studio_prefix;
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # JupyterLab sets its own Content-Security-Policy (docker/jupyter/
        # jupyter_server_config.py); a second CSP from nginx is enforced as the
        # intersection, and this one's object-src 'none' would reach Lab's own
        # PDF/HTML viewers. Declaring add_header here drops the server-level set
        # for this location, so re-add only the two that are safe everywhere and
        # leave the frame/CSP policy to Jupyter's config.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Also affected: an asset under the prefix arrived truncated, so
    # /user/x/pegasus-ai-logo-light.png became /user/testuser/pegasus-ai and the
    # logo rendered broken. The root path survived only because its rewritten URI
    # is "/", one character, which matches the original's first character.
    location ~ ^(?<studio_prefix>/user/[^/]+)/?(?<studio_web_path>.*)$ {
        proxy_pass http://studio_web/$studio_web_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix $studio_prefix;
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'href="/_next/' 'href="$studio_prefix/_next/';
        sub_filter 'src="/_next/' 'src="$studio_prefix/_next/';
        sub_filter 'href="./_next/' 'href="$studio_prefix/_next/';
        sub_filter 'src="./_next/' 'src="$studio_prefix/_next/';
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://studio_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";
    }

    # Next.js HMR WebSocket (dev only)
    location /_next/webpack-hmr {
        proxy_pass http://studio_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";
    }

    # --- Backend API ---
    location /api/ {
        proxy_pass http://studio_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- WebSocket terminals ---
    location /ws/ {
        proxy_pass http://studio_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- JupyterLab (on-demand, port 8889) ---
    # WebSocket upgrade headers are set on the MAIN /jupyter/ location, not on a
    # narrower sub-path, so that EVERY Jupyter websocket works — kernels,
    # terminals and whatever else an installed extension opens under
    # /jupyter/api/. The $connection_upgrade map keeps plain HTTP requests
    # working (Connection: close when there is no Upgrade header). Without this,
    # those sockets silently fail and JupyterLab shows "Unable to reconnect to
    # the server".
    location /jupyter/ {
        proxy_pass http://127.0.0.1:8889/jupyter/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Port-preserving Host — see the /user/<name>/jupyter block above.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Script-Name "";
        proxy_set_header X-Auth-User "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # See the /user/<name>/jupyter block: Jupyter owns its own CSP and frame
        # policy, so this location re-declares only the two headers that are
        # safe everywhere.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
