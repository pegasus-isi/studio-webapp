upstream studio_api {
    server 127.0.0.1:8080;
}

upstream studio_web {
    server 127.0.0.1:3000;
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888;
    server_name _;

    client_max_body_size 100M;

    # KubeSpawner/JupyterHub exposes the server below /user/<name>. The browser
    # must keep that prefix, but the internal Studio services route from /.
    location ~ ^/user/[^/]+$ {
        return 308 $uri/$is_args$args;
    }

    location ~ ^/user/[^/]+/api(?:/.*)?$ {
        rewrite ^/user/[^/]+(/api(?:/.*)?)$ $1 break;
        proxy_pass http://studio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~ ^/user/[^/]+/ws(?:/.*)?$ {
        rewrite ^/user/[^/]+(/ws(?:/.*)?)$ $1 break;
        proxy_pass http://studio_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # JupyterLab is prefix-aware; jupyter.sh starts it with
    # ${JUPYTERHUB_SERVICE_PREFIX}/jupyter/ when KubeSpawner provides that env.
    location ~ ^/user/[^/]+/jupyter(?:/.*)?$ {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^(?<studio_prefix>/user/[^/]+)(?:/.*)?$ {
        rewrite ^/user/[^/]+/?(.*)$ /$1 break;
        proxy_pass http://studio_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $studio_prefix;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'href="/_next/' 'href="$studio_prefix/_next/';
        sub_filter 'src="/_next/' 'src="$studio_prefix/_next/';
        sub_filter 'href="./_next/' 'href="$studio_prefix/_next/';
        sub_filter 'src="./_next/' 'src="$studio_prefix/_next/';
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://studio_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js HMR WebSocket (dev only)
    location /_next/webpack-hmr {
        proxy_pass http://studio_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- Backend API ---
    location /api/ {
        proxy_pass http://studio_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- WebSocket terminals ---
    location /ws/ {
        proxy_pass http://studio_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- JupyterLab (on-demand, port 8889) ---
    # WebSocket upgrade headers are set on the MAIN /jupyter/ location so that
    # ALL Jupyter websockets work — not just kernels/terminals, but also
    # jupyter-ai chat (/jupyter/api/ai/...) and jupyter-collaboration RTC/yjs
    # (/jupyter/api/collaboration/...). The $connection_upgrade map keeps plain
    # HTTP requests working (Connection: close when there's no Upgrade header).
    # Without this, those sockets silently fail and JupyterLab shows
    # "Unable to reconnect to the server".
    location /jupyter/ {
        proxy_pass http://127.0.0.1:8889/jupyter/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
