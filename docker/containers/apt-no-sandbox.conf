// Mounted read-only into Build Image runs (podman/buildah -v) at
// /etc/apt/apt.conf.d/00-studio-no-sandbox.conf. Keeps apt running as root
// instead of dropping to the _apt user, which fails under podman's single-UID
// mapping (no /etc/subuid ranges for spawner UIDs):
//   E: setgroups 65534 failed - setgroups (1: Operation not permitted)
// See studio-api/services/image_builder.py (_APT_FIX).
APT::Sandbox::User "root";
