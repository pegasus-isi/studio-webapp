// Bound read-only into Build Image runs (apptainer build --bind) at
// /etc/apt/apt.conf.d/00-studio-no-sandbox.conf. Keeps apt running as root
// instead of dropping to the _apt user, which fails wherever root is emulated
// rather than real (no /etc/subuid ranges for spawner UIDs):
//   E: setgroups 65534 failed - setgroups (1: Operation not permitted)
// Applies to %post sections on Debian/Ubuntu bases.
// See studio-api/services/image_builder.py (_APT_FIX).
APT::Sandbox::User "root";
