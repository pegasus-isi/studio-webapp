# Container storage configuration for rootless podman builds (Build Image).
#
# The studio deployment keeps $HOME (and therefore podman's rootless
# graphroot, ~/.local/share/containers/storage) on an NFS-backed PVC —
# deliberately: build cache survives pod restarts. Two settings make
# rootless builds behave well in that environment:
#
# * ignore_chown_errors — spawner-injected UIDs (SSSD users) have no
#   /etc/subuid ranges, so podman builds run with a single-UID mapping.
#   Image layers or Dockerfile steps that chown to other users would fail;
#   this maps everything to the build user instead.
# * force_mask — podman detects the NFS backing store and enforces this
#   overlay option on every build anyway (with a warning asking for it to
#   be codified here). Setting it silences the per-build warning and keeps
#   behavior identical on non-NFS deployments.

[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = []
ignore_chown_errors = "true"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev"
force_mask = "700"
