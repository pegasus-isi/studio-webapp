[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---- Studio API (FastAPI/uvicorn) ----
[program:studio-api]
; Loopback only: nginx on :8888 (the sole EXPOSEd port) proxies from 127.0.0.1
; and nothing else in the pod talks to :8080. On a flat pod network a 0.0.0.0
; bind was reachable from any other pod, and the API has no per-request auth.
command=uvicorn main:app --host 127.0.0.1 --port 8080
directory=/opt/studio-api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- Studio Web (Next.js standalone) ----
[program:studio-web]
command=node server.js
directory=/opt/studio-web
; Next standalone binds HOSTNAME/PORT; same loopback rationale as studio-api.
environment=HOSTNAME="127.0.0.1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- JupyterLab ----
[program:jupyter]
command=/etc/supervisor/scripts/jupyter.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- Nginx (reverse proxy, starts last so backends are up first) ----
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
