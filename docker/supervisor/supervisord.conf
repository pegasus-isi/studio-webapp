[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---- Studio API (FastAPI/uvicorn) ----
[program:studio-api]
command=uvicorn main:app --host 0.0.0.0 --port 8080
directory=/opt/studio-api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- Studio Web (Next.js standalone) ----
[program:studio-web]
command=node server.js
directory=/opt/studio-web
environment=HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- JupyterLab ----
[program:jupyter]
command=/etc/supervisor/scripts/jupyter.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- OpenCode agent server (the chat panel's engine, #367) ----
; Loopback only; studio-api proxies the browser to it. autorestart matters more
; here than for the other programs: the LLM propagator restarts this process
; when provider config changes, because OpenCode reads opencode.json once at
; startup and neither dispose endpoint reloads it.
[program:opencode]
command=/etc/supervisor/scripts/opencode.sh
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- Nginx (reverse proxy, starts last so backends are up first) ----
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
