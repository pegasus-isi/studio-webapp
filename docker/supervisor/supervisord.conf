; PegasusAI Studio process supervision.
;
; Ports and runtime paths come from the environment via supervisord's own
; %(ENV_VAR)s expansion, set by docker/entrypoint.sh. There is no default
; syntax for those, so supervisord fails to start if one is unset — that is on
; purpose: a silently-defaulted port would bind the wrong one and be found
; later, by a user, as a session that cannot reach its own backend.
;
; supervisorctl reads this same file (services/opencode_server.py restarts the
; engine through it), so anything invoking it must inherit that environment.
; It does: every process here is a child of the entrypoint that exported it.

[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=%(ENV_STUDIO_RUNTIME_DIR)s/supervisord.pid
loglevel=info

[unix_http_server]
file=%(ENV_STUDIO_RUNTIME_DIR)s/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_STUDIO_RUNTIME_DIR)s/supervisor.sock

; ---- Studio API (FastAPI/uvicorn) ----
[program:studio-api]
command=uvicorn main:app --host %(ENV_STUDIO_BIND_ADDR)s --port %(ENV_STUDIO_API_PORT)s
directory=/opt/studio-api
; The API runs as the user, and the user's site-packages (~/.local/lib/pythonX/
; site-packages, on the persistent home) sit on /usr/bin/python3's path ahead
; of the image's. A `pip install --user` of a different pydantic, fastapi or
; numpy -- the assistant does this to "test a step", users do it for notebooks
; -- would then shadow what the backend was built against and take it down on
; the next restart, with the cause in a directory nobody looks in. The backend
; sees only the image. JupyterLab is deliberately not shielded: notebook users
; install into the user site on purpose and their kernels inherit its env.
environment=PYTHONNOUSERSITE="1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- Studio Web (Next.js standalone) ----
[program:studio-web]
command=node server.js
directory=/opt/studio-web
; API_URL is not optional here. Anything server-side in studio-web that
; calls studio-api directly falls back to a literal localhost:8080, which
; with an allocated API port reaches nothing, and fails with nothing in any
; log saying why. (The first such caller, the /welcome redirect's ui-prefs
; fetch, is gone; keep this set for the next one.)
; 127.0.0.1, not localhost: uvicorn binds IPv4 and localhost can resolve to
; ::1 first.
; STUDIO_INTERNAL_SECRET is named explicitly rather than left to inherit:
; server components call studio-api directly on loopback, so on a gated
; session they must present the header the proxy would have stamped. It is
; empty when the gate is off, and an empty header is simply absent.
environment=HOSTNAME="%(ENV_STUDIO_BIND_ADDR)s",PORT="%(ENV_STUDIO_WEB_PORT)s",API_URL="http://127.0.0.1:%(ENV_STUDIO_API_PORT)s",STUDIO_INTERNAL_SECRET="%(ENV_STUDIO_INTERNAL_SECRET)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- JupyterLab ----
[program:jupyter]
command=/etc/supervisor/scripts/jupyter.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- OpenCode agent server (the chat panel's engine, #367) ----
; Loopback only; studio-api proxies the browser to it. autorestart matters more
; here than for the other programs: the LLM propagator restarts this process
; when provider config changes, because OpenCode reads opencode.json once at
; startup and neither dispose endpoint reloads it.
[program:opencode]
command=/etc/supervisor/scripts/opencode.sh
autostart=true
autorestart=true
startretries=10
; The engine spawns children of its own — tool shells, MCP servers, language
; servers — so a stop that signalled only the exec'd process would orphan them
; and the next start would race whatever they still hold.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---- Nginx (reverse proxy, starts last so backends are up first) ----
[program:nginx]
command=nginx -c %(ENV_STUDIO_RUNTIME_DIR)s/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
