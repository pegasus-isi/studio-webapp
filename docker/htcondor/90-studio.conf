
CONDOR_HOST = ap.pegasus-ai.org
CREDD_HOST = $(CONDOR_HOST)
NETWORK_INTERFACE = *
SCHEDD_HOST = $(CONDOR_HOST)

# annex
use feature:HPC_ANNEX
ANNEX_COLLECTOR = $(SCHEDD_HOST):$(SHARED_PORT_PORT)?sock=ap_collector

# annex - allow non-annex jobs to run
addl_reqs = ifThenElse(TARGET.AuthenticatedIdentity is undefined, true, $(my_identity) == TARGET.AuthenticatedIdentity)

# default annex name is the username
JOB_TRANSFORM_AnnexUserName @=end
   REQUIREMENTS TargetAnnexName =?= undefined && JobUniverse != 7 && JobUniverse != 12
   SET TargetAnnexName "$(MY.Owner)"
@end
JOB_TRANSFORM_NAMES = AnnexUserName $(JOB_TRANSFORM_NAMES)

# override the HTCondor transform
JOB_TRANSFORM_AssignAnnex @=end
   REQUIREMENTS TargetAnnexName =!= undefined
   #my_identity = "$(MY.Owner)@$(ANNEX_TOKEN_DOMAIN)"
   #addl_reqs = ifThenElse(TARGET.AuthenticatedIdentity is undefined, true, $(my_identity) == TARGET.AuthenticatedIdentity)
   if defined MY.JobMachineAttrs
   SET JobMachineAttrs "$(MY.JobMachineAttrs),AnnexName"
   else
   SET JobMachineAttrs "AnnexName"
   endif
   #if defined MY.Requirements
   #SET Requirements $(addl_reqs) && ($(MY.Requirements))
   #else
   #SET Requirements $(addl_reqs)
   #endif
@end

