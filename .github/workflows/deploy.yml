name: Build and Push Docker Image

# The :main tag auto-deploys: production pulls it with imagePullPolicy: Always,
# so a push to main reaches live user pods on their next spawn. The test job
# below is the only automated gate in front of that — do not remove it.
# Pushes to develop publish :develop the same way (metadata-action tags by
# branch name); nothing in production pulls :develop, so it is safe for
# staging/testing images.
on:
  push:
    branches: ['main', 'develop']
    tags: ['v*']
  pull_request:
    branches: ['main', 'develop']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per ref, newest wins. Without this, merges a minute apart start
# independent runs and whichever *finishes* last tags :main — on 2026-10-09
# four merges raced and the build of an older commit landed last, so :main
# shipped without the two most recent PRs while every run reported success.
# Cancelling the in-progress run for the same ref means the last commit is the
# one that publishes. Keyed on the ref, so main, develop, each tag and each PR
# have their own lane and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend tests, frontend type check, frontend unit tests. Mirrors the local
  # pre-PR gates in CLAUDE.md: pytest needs no Pegasus/Condor/keys; on the
  # frontend it is tsc plus `npm test` (vitest, lib/ only — `npm run lint` is
  # still not a gate, eslint isn't installed).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skills and agents are authored in pegasus-isi/claude-plugin-marketplace
      # and installed as the pegasus-ai-knowledge package. A copy here is how the
      # two drifted apart before, so reintroducing one fails the build rather
      # than quietly diverging again. Studio-specific context goes in
      # knowledge/overlay/, which is composed on top of the shared guide.
      - name: No second copy of the knowledge base
        run: |
          for dir in knowledge/skills knowledge/agents knowledge/templates \
                     knowledge/examples knowledge/mcp knowledge/references; do
            if [ -e "$dir" ]; then
              echo "::error::$dir must not exist — the knowledge base is authored in"
              echo "::error::pegasus-isi/claude-plugin-marketplace and installed as a package."
              echo "::error::Studio-specific context belongs in knowledge/overlay/."
              exit 1
            fi
          done
          echo "knowledge/ carries only the Studio overlay:"
          find knowledge -type f | sort

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio-api/requirements.txt
      - name: Backend tests
        working-directory: studio-api
        run: |
          # supervisor is not an API dependency — it supervises the image's
          # processes. It is installed here so test_port_rendering.py can parse
          # the real supervisord.conf: a bad %(ENV_VAR)s there is not a wrong
          # port, it is a container whose every service fails to start.
          pip install -r requirements.txt pytest httpx supervisor
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studio-web/package-lock.json
      - name: Frontend type check
        working-directory: studio-web
        run: |
          npm ci
          node_modules/.bin/tsc --noEmit
      # Unit tests for lib/ only — the transcript state machine behind the
      # OpenCode chat engine (#367), whose rules come from measured server
      # behaviour rather than from anything tsc can see. No DOM, no component
      # tests.
      - name: Frontend unit tests
        working-directory: studio-web
        run: npm test

  # On pull_request this builds without pushing (validates the Dockerfile);
  # only pushes on main/tag pushes. Login is skipped on PRs so forked PRs
  # (read-only GITHUB_TOKEN) don't fail at the login step.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
